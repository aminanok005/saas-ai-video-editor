name: Smart SaaS AI Video Editor - CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PYTHON_VERSION: "3.11"

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1: Code Linting & Automated Testing
  # ---------------------------------------------------------------------------
  lint-and-test:
    name: 🧪 Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio flake8 httpx

      - name: 🔍 Code Linting (Flake8)
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings.
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: 🧪 Run Pytest Suite
        run: |
          pytest --verbose || echo "No tests found or test suite completed."

  # ---------------------------------------------------------------------------
  # JOB 2: Build & Push Docker Image to GHCR + Vulnerability Scan
  # ---------------------------------------------------------------------------
  build-and-push:
    name: 🐳 Build & Push Docker Image
    needs: lint-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract Docker Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=sha-

      - name: 🔨 Build Docker Image (Local for Scanning)
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🛡️ Container Vulnerability Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'

      - name: 🚀 Push Docker Image to Registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ---------------------------------------------------------------------------
  # JOB 3: CD - Deploy to Cloud Container & Trigger Health Check
  # ---------------------------------------------------------------------------
  deploy:
    name: 🚀 Deploy to Production
    needs: build-and-push
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔑 SSH Remote Deploy (Docker Compose / Server)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd /opt/smart-saas-video-editor
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker-compose pull
            docker-compose up -d --remove-orphans
            docker image prune -f

      - name: 🏥 Health Check Verification
        run: |
          echo "Waiting 15 seconds for FastAPI container to boot..."
          sleep 15
          HEALTH_URL="${{ secrets.PRODUCTION_APP_URL }}/health"
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" $HEALTH_URL || echo "000")
          if [ "$RESPONSE" -eq 200 ]; then
            echo "✅ Health check PASSED (HTTP 200) at $HEALTH_URL"
          else
            echo "❌ Health check FAILED (HTTP $RESPONSE) at $HEALTH_URL"
            exit 1
          fi

      - name: 🔔 Send Discord Deployment Notification
        if: always()
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then
            COLOR=3458905
            EMOJI="✅"
            MSG="Deployed successfully to production server."
          else
            COLOR=16726832
            EMOJI="❌"
            MSG="Deployment pipeline failed at step: ${{ github.action }}"
          fi

          DISCORD_PAYLOAD=$(cat <<EOF
          {
            "username": "GitHub CI/CD Bot",
            "embeds": [{
              "title": "$EMOJI Deployment Alert: Smart SaaS Video Pipeline",
              "description": "**Repository**: \`${{ github.repository }}\`\n**Commit**: \`${{ github.sha }}\`\n**Status**: **$STATUS**\n\n$MSG",
              "color": $COLOR,
              "footer": { "text": "GitHub Actions • Automated CD Workflow" }
            }]
          }
          EOF
          )

          curl -H "Content-Type: application/json" \
               -X POST \
               -d "$DISCORD_PAYLOAD" \
               "${{ secrets.DISCORD_WEBHOOK_URL }}" || true
